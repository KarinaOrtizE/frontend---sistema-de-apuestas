<h2 mat-dialog-title>
  {{ data.mode === 'create' ? 'Nueva Apuesta' : 'Editar Apuesta' }}
</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="dialog-form" style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem;">
    
    <mat-form-field appearance="outline">
      <mat-label>UUID Usuario</mat-label>
      <input matInput formControlName="id_usuario" placeholder="Ej: 123e4567-e89b-12d3..." />
      <mat-error *ngIf="form.controls.id_usuario.hasError('required')">Requerido</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>UUID Sorteo</mat-label>
      <input matInput formControlName="id_sorteo" />
      <mat-error *ngIf="form.controls.id_sorteo.hasError('required')">Requerido</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Monto Apostado</mat-label>
      <input matInput type="number" formControlName="monto_apostado" step="0.01" min="0" />
      <mat-error *ngIf="form.controls.monto_apostado.hasError('required')">Requerido</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Estado de la Apuesta</mat-label>
      <mat-select formControlName="estado">
        @for (est of estados(); track est) {
          <mat-option [value]="est">{{ est | titlecase }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>UUID Usuario (Auditoría/Creador)</mat-label>
      <input matInput formControlName="id_usuario_creador_o_editor" />
      <mat-hint>ID de quien crea/edita este registro</mat-hint>
      <mat-error *ngIf="form.controls.id_usuario_creador_o_editor.hasError('required')">Requerido</mat-error>
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancelar</button>
  <button mat-flat-button color="primary" type="button" (click)="save()" [disabled]="form.invalid">
    Guardar
  </button>
</mat-dialog-actions>
