<div class="page-head">
  <h1>Gestión de Apuestas</h1>

  <button
    mat-flat-button
    color="primary"
    type="button"
    (click)="nuevo()"
  >
    <mat-icon>add</mat-icon>
    Nueva Apuesta
  </button>
</div>

@if (loading) {
  <div class="loading-container">
    <mat-spinner diameter="40"></mat-spinner>
    <span>Cargando apuestas...</span>
  </div>
} @else {
  <div class="table-wrap mat-elevation-z2">
    <table mat-table [dataSource]="dataSource" matSort>

      <ng-container matColumnDef="id_usuario">
        <th mat-header-cell *matHeaderCellDef> ID Usuario </th>
        <td mat-cell *matCellDef="let r" title="{{ r.id_usuario }}">
          {{ r.id_usuario | slice:0:8 }}...
        </td>
      </ng-container>

      <ng-container matColumnDef="id_sorteo">
        <th mat-header-cell *matHeaderCellDef> ID Sorteo </th>
        <td mat-cell *matCellDef="let r" title="{{ r.id_sorteo }}">
          {{ r.id_sorteo | slice:0:8 }}...
        </td>
      </ng-container>

      <ng-container matColumnDef="monto_apostado">
        <th mat-header-cell *matHeaderCellDef> Monto </th>
        <td mat-cell *matCellDef="let r"> {{ r.monto_apostado | currency }} </td>
      </ng-container>

      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef> Estado </th>
        <td mat-cell *matCellDef="let r"> {{ r.estado | titlecase }} </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let r" class="actions-cell">
          <button mat-icon-button type="button" color="accent" (click)="editar(r)" aria-label="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button type="button" color="warn" (click)="eliminar(r)" aria-label="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

    </table>

    <mat-paginator [pageSizeOptions]="[10, 25, 50, 100]" showFirstLastButtons></mat-paginator>
  </div>
}
