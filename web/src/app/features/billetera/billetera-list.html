<div class="page-head">
  <h1>Billeteras</h1>
  <button mat-flat-button color="primary" type="button" (click)="nueva()">
    <mat-icon>add</mat-icon>
    Nueva Billetera
  </button>
</div>

@if (loading) {
  <div class="loading-container">
    <mat-spinner diameter="40"></mat-spinner>
    <span>Cargando billeteras...</span>
  </div>
} @else {
  <div class="table-wrap mat-elevation-z2">
    <table mat-table [dataSource]="dataSource">

      <ng-container matColumnDef="id_billetera">
        <th mat-header-cell *matHeaderCellDef>ID Billetera</th>
        <td mat-cell *matCellDef="let r">{{ shortId(r.id_billetera) }}</td>
      </ng-container>

      <ng-container matColumnDef="id_usuario">
        <th mat-header-cell *matHeaderCellDef>ID Usuario</th>
        <td mat-cell *matCellDef="let r">{{ shortId(r.id_usuario) }}</td>
      </ng-container>

      <ng-container matColumnDef="saldo">
        <th mat-header-cell *matHeaderCellDef>Saldo</th>
        <td mat-cell *matCellDef="let r" class="saldo-cell">
          {{ r.saldo | currency:'COP':'symbol':'1.2-2' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="fecha_creacion">
        <th mat-header-cell *matHeaderCellDef>Fecha Creación</th>
        <td mat-cell *matCellDef="let r">{{ r.fecha_creacion | date:'short' }}</td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let r" class="actions-cell">
          <button mat-icon-button type="button" color="accent" (click)="recargar(r)" aria-label="Recargar saldo">
            <mat-icon>add_card</mat-icon>
          </button>
          <button mat-icon-button type="button" color="warn" (click)="eliminar(r)" aria-label="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons></mat-paginator>
  </div>
}
