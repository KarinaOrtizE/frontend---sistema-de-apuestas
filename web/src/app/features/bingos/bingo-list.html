<div class="page-head">
  <h1>Gestión de Bingos</h1>
  <button mat-flat-button color="primary" type="button" (click)="nuevo()">
    <mat-icon>add</mat-icon>
    Nuevo Bingo
  </button>
</div>

@if (loading) {
  <div class="loading-container">
    <mat-spinner diameter="40"></mat-spinner>
    <span>Cargando bingos...</span>
  </div>
} @else {
  <div class="table-wrap mat-elevation-z2">
    <table mat-table [dataSource]="dataSource" matSort>

      <ng-container matColumnDef="carton">
        <th mat-header-cell *matHeaderCellDef>Cartón</th>
        <td mat-cell *matCellDef="let r">
          <button mat-stroked-button type="button" (click)="verCarton(r)" aria-label="Ver cartón">
            <mat-icon>grid_on</mat-icon>
          </button>
        </td>
      </ng-container>

      <ng-container matColumnDef="aciertos">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Aciertos</th>
        <td mat-cell *matCellDef="let r">
          {{ r.aciertos }}
        </td>
      </ng-container>

      <ng-container matColumnDef="costo_entrada">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Costo Entrada</th>
        <td mat-cell *matCellDef="let r">
          $ {{ r.costo_entrada | number }}
        </td>
      </ng-container>

      <ng-container matColumnDef="recompensa">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Recompensa</th>
        <td mat-cell *matCellDef="let r">
          <span class="badge recompensa">
            $ {{ r.recompensa | number }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let r" class="actions-cell">
          <button mat-icon-button type="button" color="accent" (click)="editar(r)" aria-label="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button type="button" color="warn" (click)="eliminar(r)" aria-label="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[10, 25, 50, 100]" showFirstLastButtons></mat-paginator>
  </div>
}
