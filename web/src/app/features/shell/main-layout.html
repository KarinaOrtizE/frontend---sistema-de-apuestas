<mat-sidenav-container #sidenavShell="matSidenavContainer" class="shell" autosize>
  <mat-sidenav mode="side" opened class="nav-rail" [class.collapsed]="sidebarCollapsed()">
    
    <div class="nav-brand">
      <div class="nav-brand__mark">
        <mat-icon class="nav-brand__icon">casino</mat-icon>
      </div>
      @if (!sidebarCollapsed()) {
        <div class="nav-brand__text">
          <span class="nav-brand__title">BettingSystem</span>
          <span class="nav-brand__sub">Panel Administrativo</span>
        </div>
      }
    </div>

    <mat-nav-list class="nav-list">
      @for (item of nav; track item.path) {
        <a mat-list-item class="nav-item" [routerLink]="item.path" routerLinkActive="active-link"
           [matTooltip]="sidebarCollapsed() ? item.label : ''" matTooltipPosition="right">
          <mat-icon matListItemIcon class="nav-item__icon">{{ item.icon }}</mat-icon>
          <span matListItemTitle class="nav-label">{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>

    @if (!sidebarCollapsed()) {
      <div class="audit-sidebar">
        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="audit-field-sidebar">
          <mat-label>Actuar como...</mat-label>
          <mat-select [value]="audit.usuarioId()" (selectionChange)="onUsuarioAudit($event.value)">
            @for (u of usuarios(); track u.id_usuario) {
              <mat-option [value]="u.id_usuario">{{ u.nombre }} ({{ u.rol }})</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>
    }

    <div class="nav-footer">
      <button mat-stroked-button type="button" class="collapse-btn" (click)="toggleSidebar()">
        <mat-icon>{{ sidebarCollapsed() ? 'chevron_right' : 'chevron_left' }}</mat-icon>
        @if (!sidebarCollapsed()) { <span>Colapsar</span> }
      </button>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="main-column">
    <mat-toolbar class="top-bar">
      <button mat-icon-button (click)="toggleSidebar()" class="menu-toggle">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="title">Dashboard</span>
      <span class="spacer"></span>

      <button mat-icon-button (click)="logout()" aria-label="Salir">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>

    <main class="content">
      <div class="content-inner">
        <router-outlet />
      </div>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
